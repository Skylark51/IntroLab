[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "introlab"
version = "0.1.0"
description = "Evidence-first computational chemistry literature research CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
introlab = "introlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
